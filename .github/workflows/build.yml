name: Build HKL Agent Installer

on:
  push:
    branches:
      - main


jobs:

  build:

    runs-on: windows-latest


    steps:


    - name: Pobranie kodu
      uses: actions/checkout@v4



    - name: Instalacja Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.22"



    - name: Sprawdzenie plików
      shell: cmd
      run: |
        dir
        echo ----------------
        dir /s



    - name: Budowanie agenta
      shell: cmd
      run: |

        cd ..

        set GOOS=windows
        set GOARCH=amd64

        go build -ldflags="-H windowsgui" -o HKL-Agent.exe



    - name: Budowanie instalatora
      shell: cmd
      run: |

        cd windows_installer

        set GOOS=windows
        set GOARCH=amd64

        go build -o HKL-Agent-Setup.exe



    - name: Zapis plików
      uses: actions/upload-artifact@v4

      with:

        name: HKL-Agent-Windows

        path: |

          HKL-Agent.exe

          windows_installer/HKL-Agent-Setup.exe
