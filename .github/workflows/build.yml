name: Build HKL Agent

on:
  push:
    branches:
      - main

jobs:

  build:

    runs-on: windows-latest

    defaults:
      run:
        working-directory: windows_installer


    steps:

    - name: Pobierz kod
      uses: actions/checkout@v4


    - name: Instalacja Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.22"


    - name: Sprawdzenie plików
      shell: cmd
      run: |
        dir
        echo ------
        dir /s


    - name: Budowanie agenta
      shell: cmd
      run: |
        set GOOS=windows
        set GOARCH=amd64
        go build -ldflags="-H windowsgui" -o HKL-Agent.exe


    - name: Zapis EXE
      uses: actions/upload-artifact@v4
      with:
        name: HKL-Agent-Windows
        path: windows_installer/HKL-Agent.exe
